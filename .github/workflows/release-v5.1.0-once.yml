name: Publish BBQ Planner v5.1.1 (one-time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v5.1.0-once.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'eelbrethouwer-jpg/bbq_planner_card'
    runs-on: ubuntu-latest
    steps:
      - name: Publiceer alleen de gecontroleerde v5.1.1-mergecommit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v5.1.1"
          TARGET="8afb5a89c7d2af975f6cddcbb97598682906e543"

          # Idempotent: never overwrite a published release or change an existing tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no changes made."
            exit 0
          fi
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag $TAG exists without release; refusing to move it."
            exit 1
          fi
          gh api "repos/${GH_REPO}/commits/${TARGET}" --jq '.sha' | grep -Fx "$TARGET"

          cat > /tmp/bbq-v5.1.1-notes.md <<'NOTES'
          ## BBQ Planner v5.1.1 — Kookfuncties weer bereikbaar

          Kleine herstelrelease op v5.1.0; de bestaande kookfuncties zijn weer bereikbaar vanuit Live.

          ### Opgelost
          - Vanuit Live opent **📈 MEATER-grafiek & focusmodus** de bestaande kookpagina met de live MEATER-monitor en focusmodus.
          - De navigatie blijft op Live tijdens de kookpagina; terugkeren gaat via **← Live**.
          - Uitgebreide planning markeert Live wanneer geopend vanuit Live, anders Vandaag.
          - Hoofdtaak en volgende taken tonen ook de datum wanneer een taak niet vandaag valt.
          - Een kamado zonder gerecht toont **Niet in gebruik** in plaats van een doeltemperatuur.
          - PWA-cache, HTML-, CSS-/JS- en Home Assistant-versieverwijzingen bijgewerkt naar v5.1.1.

          ### Compatibiliteit
          Geen nieuwe localStorage-sleutels of datamigratie. Bestaande kookengine, recepten, planning, reviews en MEATER-bridge zijn behouden.

          ### Geautomatiseerde controles
          HACS-validatie, JavaScript/PWA, DOM-/opslagregressies en mobiele Chromium-/WebKit-checks geslaagd op PR #28. De release verwijst exact naar mergecommit `8afb5a89c7d2af975f6cddcbb97598682906e543`.

          ### Nog niet praktijkgetest
          Echte iPhone Safari/PWA, Home Assistant-installatie en MEATER-hardware. Controleer na de update of je recepten en opgeslagen sessies intact zijn.

          Bron: https://github.com/eelbrethouwer-jpg/bbq_planner_card/pull/28
          NOTES

          gh release create "$TAG" --target "$TARGET" --title "BBQ Planner v5.1.1 — Kookfuncties weer bereikbaar" --notes-file /tmp/bbq-v5.1.1-notes.md --latest
          ACTUAL="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')"
          if [[ "$ACTUAL" != "$TARGET" ]]; then
            echo "::error::Release tag points to unexpected commit: $ACTUAL"
            exit 1
          fi
          gh release view "$TAG" --json tagName,name,url
