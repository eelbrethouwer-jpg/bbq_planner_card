name: Publish BBQ Planner v5.5.0 (after CI)

on:
  workflow_run:
    workflows: ["HACS-validatie"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      github.repository == 'eelbrethouwer-jpg/bbq_planner_card' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact green main commit once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          TAG="v5.5.0"
          CURRENT="$(gh api "repos/${GH_REPO}/branches/main" --jq '.commit.sha')"
          if [[ "$CURRENT" != "$TARGET" ]]; then
            echo "::notice::Main moved; older commit will not be released."
            exit 0
          fi
          # The one-time 5.5.0 workflow should skip later versions after its release was published.
          if ! gh api "repos/${GH_REPO}/contents/sw.js?ref=${TARGET}" --jq '.content' | base64 -d | grep -Fq 'bbq-regisseur-v5.5.0'; then
            echo "::notice::Not v5.5.0; skip historical one-time workflow."
            exit 0
          fi
          gh api "repos/${GH_REPO}/contents/RELEASE_v5.5.0.md?ref=${TARGET}" --jq '.name' | grep -Fxq 'RELEASE_v5.5.0.md'
          gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}" --jq '.conclusion' | grep -Fxq success
          JOBS="$(gh api --paginate "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" --jq '.jobs[] | [.name,.conclusion] | @tsv')"
          for job in validate-hacs html-javascript ui-smoke mobile-browser version-consistency; do
            if ! grep -Fqx "$job"$'\t'success <<< "$JOBS"; then
              echo "::error::Required job $job missing or not green"
              exit 1
            fi
          done
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            existing="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')"
            if [[ "$existing" != "$TARGET" ]]; then
              echo "::error::Release tag points to different SHA"
              exit 1
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Exact release already exists; no action."
              exit 0
            fi
            echo "::error::Tag exists without release"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release exists without matching tag"
            exit 1
          fi
          cat > /tmp/notes.md <<'NOTES'
          ## BBQ Planner v5.5.0: live koken en tijdlijn

          Deze release bevat alles sinds v5.2.3: v5.3.0, v5.4.0 en v5.5.0 (PR #42 t/m #45).

          ### Nieuw op Live
          - **Eén kaart per gerecht:** kerntemperatuur → doel met voortgangsbalk, omgeving, stijging per minuut, "Op tafel rond HH:MM" met de bron van de schatting, en één adviesregel.
          - **Eigen schatting zonder MEATER-app:** de app berekent zelf wanneer de kern het doel haalt, uit de opwarmcurve en de omgevingstemperatuur. Bij reverse sear schat hij ook wanneer de indirecte fase klaar is (bijvoorbeeld 47 °C). Hij herkent een stall. Een MEATER-ETA wordt als tweede mening getoond.
          - **Tijdlijn bovenaan Live:** de planning als stippelkader, de verwachting in kleur, met een nu-lijn en een serveerlijn.
          - **"Zo meteen" volgt het vlees,** bijvoorbeeld "Stook de grote kamado op naar ~250 °C". Aansteken wordt afgevinkt zodra het gerecht op de BBQ ligt.
          - **"Pas planning aan op verwachting":** alleen na bevestiging, met eerst een voor/na-overzicht.
          - **MEATER automatisch herkennen** in de Home Assistant-kaart: de meetende probe wordt aan het gerecht op de BBQ gekoppeld, met voorrang voor de Pro. Je eigen keuze wint altijd.
          - **Meetgeschiedenis bij openen:** de schatting staat er direct na openen, ook na wegklikken.
          - **Scherm blijft aan** op Live (Screen Wake Lock, waar de browser of app het ondersteunt).

          ### Opgelost
          - Een tweede tik op een gekozen gerecht haalt het weer uit het menu ("+1" voor een extra portie).
          - Na wisselen van app opent de planner weer op het scherm waar je was.
          - Een gelijkblijvende meting heet "Geen verandering sinds HH:MM" in plaats van "verouderd".

          ### Opslag
          Er zijn geen nieuwe opslagsleutels. Er zijn alleen optionele velden bijgekomen (`meaterAuto` per gerecht, `view` in de sessiemetadata), met terugval voor oude data. Recepten, reviews en planningen blijven behouden.

          ### Bijwerken
          In Home Assistant: **HACS → BBQ Bereidingsplanner + MEATER → Bijwerken / Opnieuw downloaden**. Ververs daarna de app of pagina (eventueel de cache van de app legen).

          ### Nog niet in de praktijk getest
          Er is nog niet getest met een echte iPhone, Home Assistant en MEATER. Alle automatische tests gebruiken gemarkeerde testdata. Na je eerste kooksessie hoor ik graag hoe de schatting en de meldingen uitpakken.

          De app-code is gelijk aan mergecommit `b2992e9364331aaf5cbc9a3150f18edea6014b37` (PR #45). De release staat op de main-commit na de merge van de releaseworkflow; die voegt alleen deze workflow en documentatie toe, geen app-code. Deze workflow publiceert alleen als alle verplichte CI-jobs op die commit groen zijn.
          NOTES
          gh release create "$TAG" --target "$TARGET" --title "BBQ Planner v5.5.0 — live koken en tijdlijn" --notes-file /tmp/notes.md --latest
          test "$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')" = "$TARGET"
          gh release view "$TAG" --json tagName,name,url,targetCommitish
