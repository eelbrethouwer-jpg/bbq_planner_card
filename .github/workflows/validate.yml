name: HACS-validatie

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS repositoryvalidatie
        uses: hacs/action@main
        with:
          category: plugin

  html-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controleer JavaScript-syntax in zelfstandige planner
        run: |
          sed -n '/^<script>$/,/^<\/script>$/p' dist/BBQ_bereidingsplanner_MEATER_v4.html | sed '1d;$d' > /tmp/bbq-planner.js
          node --check /tmp/bbq-planner.js
          cp dist/bbq_planner_card.js /tmp/bbq-planner-bridge.mjs
          node --check /tmp/bbq-planner-bridge.mjs
          node --check dist/bbq-v5.js
          node --check dist/bbq-v501.js
          node --check dist/bbq-eta.js
          node --check engine/eta.mjs
          node --check engine/plan.mjs
          node --check sw.js
          node tests/pwa-smoke.mjs
          node tests/v5130-catalogus.mjs
      - name: Controleer releasefuncties
        run: |
          grep -q 'renderRecipeSteps(c)' dist/BBQ_bereidingsplanner_MEATER_v4.html
          grep -q 'saveReview(id,card)' dist/BBQ_bereidingsplanner_MEATER_v4.html
          grep -q 'lines(\x27ambient\x27)' dist/BBQ_bereidingsplanner_MEATER_v4.html || grep -q "lines('ambient')" dist/BBQ_bereidingsplanner_MEATER_v4.html


  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Data upgrade must load v5.1.1 source from its exact release commit.
          fetch-depth: 0
      - name: Install DOM test dependency
        run: npm install --no-save jsdom@26
      - name: Exercise planning, recipes, reviews and accordions
        run: |
          node tests/smoke.mjs
          node tests/v5-smoke.mjs
          node tests/v501-smoke.mjs
          node tests/v510-smoke.mjs
          node tests/v520-nav-smoke.mjs
          node tests/v522-live-meater.mjs
          node tests/v523-schedule-no-redraw.mjs
          node tests/v530-live-card.mjs
          node tests/v540-eta-live.mjs
          node tests/v550-session-restore.mjs
          node tests/v560-notifications.mjs
          node tests/v520-data-upgrade.mjs
          node tests/v6-engine.mjs && node tests/v6-shadow.mjs
          node tests/v6-optimizer.mjs
          node tests/v6-pr3.mjs
          node tests/v6-pr3-apply-proposal.mjs
          node tests/v6-pr3-storage.mjs
          node tests/v6-pr3-live-apply.mjs
          node tests/v6-pr3-proposal-draft.mjs
          node tests/v6-pr3-preboot.mjs
          node tests/v6-pr3-legacy-bridge.mjs
          TZ=America/New_York node tests/v6-engine.mjs && TZ=Pacific/Kiritimati node tests/v6-engine.mjs
          TZ=America/New_York node tests/v6-optimizer.mjs && TZ=Pacific/Kiritimati node tests/v6-optimizer.mjs
          node tests/eta-engine.mjs
          TZ=America/New_York node tests/eta-engine.mjs && TZ=Pacific/Kiritimati node tests/eta-engine.mjs
          node tests/v570-planning.mjs
          TZ=America/New_York node tests/v570-planning.mjs && TZ=Pacific/Kiritimati node tests/v570-planning.mjs
          node tests/v580-eta-no-probe.mjs
          TZ=America/New_York node tests/v580-eta-no-probe.mjs && TZ=Pacific/Kiritimati node tests/v580-eta-no-probe.mjs

  mobile-browser:
    # Playwright 1.56.1 ondersteunt ubuntu 26.04 nog niet; pin mobiele browserchecks op 24.04.
    runs-on: ubuntu-24.04
    # Normaal ~10-25 min. Elke stap heeft hieronder een eigen time-out, zodat een hang als duidelijke fout
    # van die stap faalt; deze job-grens is alleen het laatste vangnet.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Stel apt in op herhalen en time-outs
        # Gemeten oorzaak van de trage runs: `playwright install --with-deps` haalde 126 MB uit de apt-mirror van
        # de runner in 14 min 23 s (146 kB/s); in de runs mislukte/hing de job in die installatiestap, niet in de tests.
        timeout-minutes: 2
        run: |
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::ftp::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-ci-retries
      - name: Installeer Playwright
        timeout-minutes: 5
        run: npm install --no-save playwright@1.56.1
      - name: Bewaar gedownloade browsers tussen runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ runner.os }}-chromium-webkit
      - name: Download browsers (Chromium en WebKit)
        timeout-minutes: 10
        run: npx playwright install chromium webkit
      - name: Installeer systeemafhankelijkheden van de browsers (apt, met herpoging)
        # apt hervat deels gedownloade pakketten; een trage mirror krijgt zo tot 3 pogingen van elk 7 min i.p.v. één onbegrensde.
        timeout-minutes: 25
        run: |
          for attempt in 1 2 3; do
            if timeout 420 sudo env "PATH=$PATH" npx playwright install-deps chromium webkit; then exit 0; fi
            echo "::warning title=apt-installatie::poging $attempt van 3 mislukt of te traag (>7 min); opnieuw"
          done
          echo "::error title=apt-installatie::systeemafhankelijkheden van de browsers konden na 3 pogingen niet worden geinstalleerd (trage of onbereikbare apt-mirror, geen testfout)"
          exit 1
      - name: Controleer iPhone-formulierbreedtes (Chromium/WebKit) en HA-iframe
        # Draaier met time-out per test (6 min), procesgroep-kill bij een hang en eenmalige herpoging alleen
        # voor infrastructuurfouten bij starten/laden (nooit voor assertions). Zie tests/run-browser-suite.mjs.
        timeout-minutes: 30
        run: node tests/run-browser-suite.mjs

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Volledige historie: de bewaking vergelijkt met de vaste PR-base (of de vorige push),
          # niet met een verschuivende origin/main.
          fetch-depth: 0
      - name: Bewaak v5-publicatie (beschermde paden, allowlist, laders, opslagcontract)
        # Base: PR → vaste PR-base-SHA; push naar main (ook de merge) → vorige main-SHA;
        # overige branches/schedule → merge-base met origin/main. Zonder base: fail-closed.
        # Contract: .github/publication-guard.json. Faalt bij wijzigingen in engine/** of v6/**,
        # niet-toegestane productiebestanden, productiewijziging zonder nieuwe appversie,
        # verwijzingen/laders naar v6 of engine (ook dynamisch of gecodeerd) en gewijzigde
        # opslagsleutels, berichttypen of opslag-/schemaregels.
        env:
          GUARD_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before) || '' }}
        run: node tests/v5-publication-guard.mjs
      - name: Bewijs dat de publicatiebewaking verboden mutaties detecteert
        env:
          GUARD_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before) || '' }}
        run: node tests/v5-publication-guard-negative.mjs
      - name: Controleer dynamisch versiecontract en mutatie-regressies
        run: |
          node tests/version-consistency.mjs
          node tests/v6-pr3-publish-guard.mjs
      - name: Test de vaste releaseworkflow (nagebootste gh, fixtures)
        run: node tests/release-workflow.mjs
