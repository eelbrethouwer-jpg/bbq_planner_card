name: HACS-validatie

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS repositoryvalidatie
        uses: hacs/action@main
        with:
          category: plugin

  html-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controleer JavaScript-syntax in zelfstandige planner
        run: |
          sed -n '/^<script>$/,/^<\/script>$/p' dist/BBQ_bereidingsplanner_MEATER_v4.html | sed '1d;$d' > /tmp/bbq-planner.js
          node --check /tmp/bbq-planner.js
          cp dist/bbq_planner_card.js /tmp/bbq-planner-bridge.mjs
          node --check /tmp/bbq-planner-bridge.mjs
          node --check dist/bbq-v5.js
          node --check dist/bbq-v501.js
          node --check sw.js
          node tests/pwa-smoke.mjs
      - name: Controleer releasefuncties
        run: |
          grep -q 'renderRecipeSteps(c)' dist/BBQ_bereidingsplanner_MEATER_v4.html
          grep -q 'saveReview(id,card)' dist/BBQ_bereidingsplanner_MEATER_v4.html
          grep -q 'lines(\x27ambient\x27)' dist/BBQ_bereidingsplanner_MEATER_v4.html || grep -q "lines('ambient')" dist/BBQ_bereidingsplanner_MEATER_v4.html


  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Data upgrade must load v5.1.1 source from its exact release commit.
          fetch-depth: 0
      - name: Install DOM test dependency
        run: npm install --no-save jsdom@26
      - name: Exercise planning, recipes, reviews and accordions
        run: |
          node tests/smoke.mjs
          node tests/v5-smoke.mjs
          node tests/v501-smoke.mjs
          node tests/v510-smoke.mjs
          node tests/v520-nav-smoke.mjs
          node tests/v522-live-meater.mjs
          node tests/v523-schedule-no-redraw.mjs
          node tests/v520-data-upgrade.mjs
          node tests/v6-engine.mjs && node tests/v6-shadow.mjs
          node tests/v6-optimizer.mjs
          node tests/v6-pr3.mjs
          node tests/v6-pr3-apply-proposal.mjs
          node tests/v6-pr3-storage.mjs
          node tests/v6-pr3-live-apply.mjs
          node tests/v6-pr3-proposal-draft.mjs
          node tests/v6-pr3-preboot.mjs
          node tests/v6-pr3-legacy-bridge.mjs
          TZ=America/New_York node tests/v6-engine.mjs && TZ=Pacific/Kiritimati node tests/v6-engine.mjs
          TZ=America/New_York node tests/v6-optimizer.mjs && TZ=Pacific/Kiritimati node tests/v6-optimizer.mjs

  mobile-browser:
    # Playwright 1.56.1 ondersteunt ubuntu 26.04 nog niet; pin mobiele browserchecks op 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Installeer browser voor mobiele viewporttest
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Controleer iPhone-formulierbreedtes (Chromium/WebKit) en HA-iframe
        run: |
          node tests/mobile-bounds.mjs
          node tests/v6-pr3-browser.mjs
          node tests/v6-pr3-lock-browser.mjs
          node tests/v6-pr3-real-v5-browser.mjs
          node tests/v520-mobile-ux.mjs

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Volledige historie: de bewaking vergelijkt met de vaste PR-base (of de vorige push),
          # niet met een verschuivende origin/main.
          fetch-depth: 0
      - name: Bewaak v5-publicatie (beschermde paden, allowlist, laders, opslagcontract)
        # Base: PR → vaste PR-base-SHA; push naar main (ook de merge) → vorige main-SHA;
        # overige branches/schedule → merge-base met origin/main. Zonder base: fail-closed.
        # Contract: .github/publication-guard.json. Faalt bij wijzigingen in engine/** of v6/**,
        # niet-toegestane productiebestanden, productiewijziging zonder nieuwe appversie,
        # verwijzingen/laders naar v6 of engine (ook dynamisch of gecodeerd) en gewijzigde
        # opslagsleutels, berichttypen of opslag-/schemaregels.
        env:
          GUARD_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before) || '' }}
        run: node tests/v5-publication-guard.mjs
      - name: Bewijs dat de publicatiebewaking verboden mutaties detecteert
        env:
          GUARD_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before) || '' }}
        run: node tests/v5-publication-guard-negative.mjs
      - name: Controleer dynamisch versiecontract en mutatie-regressies
        run: |
          node tests/version-consistency.mjs
          node tests/v6-pr3-publish-guard.mjs
