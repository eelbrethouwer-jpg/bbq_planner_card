name: HACS-validatie

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS repositoryvalidatie
        uses: hacs/action@main
        with:
          category: plugin

  html-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controleer JavaScript-syntax in zelfstandige planner
        run: |
          sed -n '/^<script>$/,/^<\/script>$/p' dist/BBQ_bereidingsplanner_MEATER_v4.html | sed '1d;$d' > /tmp/bbq-planner.js
          node --check /tmp/bbq-planner.js
      - name: Controleer releasefuncties
        run: |
          grep -q 'renderRecipeSteps(c)' dist/BBQ_bereidingsplanner_MEATER_v4.html
          grep -q 'saveReview(id,card)' dist/BBQ_bereidingsplanner_MEATER_v4.html
          grep -q 'lines(\x27ambient\x27)' dist/BBQ_bereidingsplanner_MEATER_v4.html || grep -q "lines('ambient')" dist/BBQ_bereidingsplanner_MEATER_v4.html


  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install DOM test dependency
        run: npm install --no-save jsdom@26
      - name: Exercise planning, recipes, reviews and accordions
        run: node tests/smoke.mjs
